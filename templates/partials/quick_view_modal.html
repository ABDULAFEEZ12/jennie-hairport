<div class="modal-overlay" data-quick-view-modal>
  <div class="modal-overlay__bg"></div>
  <div class="modal-card" data-product-payload>
    <button class="modal-close" data-quick-view-close aria-label="Close quick view">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
    </button>

    <div class="modal-card__media" data-qv-media></div>

    <div class="modal-card__body">
      <p class="eyebrow" data-qv-category style="text-transform:capitalize;"></p>
      <h3 style="margin-top:0.25rem;font-size:1.4rem;" data-qv-name></h3>
      <div class="price-row" style="margin-top:0.5rem;">
        <span class="price" style="font-size:1.1rem;" data-qv-price></span>
        <span class="price-old" data-qv-old-price style="display:none;"></span>
      </div>
      <p class="mt-2" style="font-size:0.9rem;color:var(--ink-700);" data-qv-description></p>

      <div class="mt-2">
        <p class="text-muted" style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.4rem;">Length (inches)</p>
        <div class="length-options" data-length-selector></div>
      </div>

      <span data-selected-length style="display:none;"></span>

      <div class="mt-2" data-qty-stepper>
        <p class="text-muted" style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.4rem;">Quantity</p>
        <div class="qty-control">
          <button type="button" data-qty-stepper-down>&minus;</button>
          <span data-selected-qty>1</span>
          <button type="button" data-qty-stepper-up>+</button>
        </div>
      </div>

      <div class="mt-3" style="display:flex;flex-direction:column;gap:0.6rem;">
        <button class="btn btn-primary" data-add-to-cart>Add to Bag</button>
        <a href="#" data-qv-view-link style="text-align:center;font-size:0.9rem;font-weight:600;color:var(--burgundy-700);">View full details</a>
      </div>
    </div>
  </div>
</div>
