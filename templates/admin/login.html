{% extends "admin/base.html" %}
{% block title %}Admin Sign In | {{ SITE.name }}{% endblock %}
{% block admin_content %}
<div class="admin-login-wrap">
  <div class="admin-login-card">
    <div style="display:flex;justify-content:center;margin-bottom:1.25rem;">
      <span class="logo__text" style="color:var(--burgundy-900);">Jennie<b style="color:var(--gold-600);">_</b>Hairport</span>
    </div>
    <h1 style="text-align:center;font-size:1.2rem;">Admin Sign In</h1>
    <form method="post" style="margin-top:1.5rem;display:flex;flex-direction:column;gap:1rem;">
      <input type="password" name="password" placeholder="Password" required autofocus>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>
  </div>
</div>
{% endblock %}
